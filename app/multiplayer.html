<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Pick Me — Multiplayer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e11;
        --panel: #12171d;
        --line: #222a34;
        --ink: #e8edf2;
        --dim: #8b97a5;
        --accent: #d8fd71;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; background: radial-gradient(130% 95% at 50% 6%, #16202a 0%, #0b0e11 55%, #07090b 100%); }
      #stage canvas { display: block; }
      .hidden { display: none !important; }
      .overlay { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      button { pointer-events: auto; }
      h1, h2 { margin: 0; font-weight: 700; }

      .hud { padding: 14px 20px 40px; text-align: center; background: linear-gradient(180deg, rgba(7,9,11,0.94) 0%, rgba(7,9,11,0.82) 45%, rgba(7,9,11,0) 100%); }
      .kicker { font-size: 10.5px; letter-spacing: 0.3em; color: var(--dim); }
      .hp-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 8px; }
      .hp { flex: 1 1 0; max-width: 300px; }
      .hp span { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }
      .hp .bar { height: 7px; margin-top: 4px; border-radius: 99px; background: #1a222c; overflow: hidden; }
      .hp .bar i { display: block; height: 100%; width: 100%; border-radius: 99px; transition: width 0.45s ease; }
      .hp.you .bar i { background: linear-gradient(90deg, #7fd84c, var(--accent)); }
      .hp.them .bar i { background: linear-gradient(90deg, #c14a4a, var(--bad)); }
      .hp.them { text-align: right; }
      .round { min-width: 180px; }
      .round #round-label { font-size: 12px; letter-spacing: 0.12em; }
      .round #owner-label { font-size: 10px; letter-spacing: 0.14em; color: var(--dim); }
      .round #owner-label.you { color: var(--accent); }
      .round #owner-label.them { color: var(--bad); }
      .clock { height: 4px; margin: 12px auto 0; max-width: 640px; border-radius: 99px; background: #161d25; overflow: hidden; }
      .clock i { display: block; height: 100%; width: 100%; background: var(--accent); transition: background 0.3s ease; }
      .clock i.low { background: var(--bad); }
      .scores { display: flex; justify-content: center; align-items: flex-start; gap: 30px; margin-top: 4px; min-height: 44px; }
      .score { display: flex; flex-direction: column; align-items: center; gap: 1px; }
      .score b { font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--dim); transition: color 0.25s ease; }
      .score span { font-size: 9px; letter-spacing: 0.22em; color: var(--dim); }
      .score.win b, .score.win span { color: var(--accent); }
      .score.lose b { color: var(--bad); }
      .verdict { max-width: 660px; margin: 2px auto 0; }
      .verdict-line { font-size: 13.5px; letter-spacing: 0.1em; }
      .verdict-line.good { color: var(--accent); }
      .verdict-line.bad { color: var(--bad); }
      .facts { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 8px; margin-top: 5px; font-size: 11.5px; color: var(--dim); }
      .facts i { font-style: normal; color: #3a444f; }
      .facts b { font-weight: 600; color: var(--ink); }
      .facts .found b { color: var(--accent); }

      .controls { padding: 46px 16px 14px; text-align: center; background: linear-gradient(0deg, rgba(7,9,11,0.94) 0%, rgba(7,9,11,0.8) 45%, rgba(7,9,11,0) 100%); }
      .readout { min-height: 21px; font-size: 12.5px; letter-spacing: 0.04em; color: var(--dim); }
      .readout.ok { color: var(--accent); }
      .readout.bad { color: var(--bad); }
      .readout.shake { animation: shake 0.3s ease; }
      @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      #next-row { margin-bottom: 8px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .buttons button { font: inherit; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #10150a; font-weight: 700; }
      button:disabled { opacity: 0.4; cursor: default; }
      button.ghost { font: inherit; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; }
      .wall { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; min-height: 22px; }
      .chip { display: flex; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 11px; background: #141a21; border: 1px solid var(--line); }
      .chip.good .chip-y { color: var(--accent); }
      .chip.bad .chip-y { color: var(--bad); }
      .chip-r, .chip-x { color: var(--dim); }

      .tile { position: relative; width: 42px; height: 46px; border-radius: 7px; border: 1px solid #2a333d; background: linear-gradient(180deg, #212a33, #161d25); color: var(--ink); font: inherit; cursor: pointer; }
      .tile .tl { font-size: 20px; font-weight: 700; }
      .tile .tv { position: absolute; right: 5px; bottom: 3px; font-size: 10px; color: var(--dim); }
      .tile.blank .tl { color: var(--accent); }
      #blank-picker { position: fixed; inset: 0; z-index: 20; pointer-events: auto; background: rgba(7,9,11,0.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
      .picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 420px; }

      .screen { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; overflow-y: auto; background: linear-gradient(180deg, rgba(7,9,11,0.72), rgba(7,9,11,0.94)); backdrop-filter: blur(3px); text-align: center; }
      .brand { font-size: 30px; letter-spacing: 0.22em; font-weight: 800; }
      .tag { margin: 0; max-width: 540px; color: var(--dim); font-size: 13px; line-height: 1.7; }
      .tag em { color: var(--ink); font-style: normal; }
      .pick-h { font-size: 10.5px; letter-spacing: 0.24em; color: var(--dim); margin-top: 4px; }
      .pick-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .pick-option { font: inherit; min-width: 118px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
      .pick-option b { display: block; font-size: 13px; letter-spacing: 0.1em; }
      .pick-option span { font-size: 11px; color: var(--dim); }
      .pick-option.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
      .pick-option.on b { color: var(--accent); }
      .pick-option.with-swatch { display: flex; align-items: center; gap: 10px; min-width: 150px; text-align: left; }
      .pick-option .swatch { display: block; width: 30px; height: 30px; border-radius: 7px; border: 1px solid rgba(0,0,0,0.4); }
      button.big { padding: 12px 34px; font-size: 15px; margin-top: 6px; }
      .dict { font-size: 11px; color: #5c6673; }
      .player-card { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
      .player-card img { width: 38px; height: 38px; border-radius: 50%; background: #1d242c; }
      .player-card .who { text-align: left; min-width: 130px; }
      .player-card .nm { font-size: 13px; }
      .player-card .ac { font-size: 11px; color: var(--dim); }
      .board-card { width: min(560px, 92vw); padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); text-align: left; }
      .board-card ol { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; }
      .board-card li { display: flex; gap: 10px; padding: 4px 0; border-top: 1px solid #1a222b; }
      .board-card li:first-child { border-top: 0; }
      .board-card li.me { color: var(--accent); }
      .board-rank { width: 22px; color: var(--dim); }
      .board-name { flex: 1; }
      .board-stats { color: var(--dim); }
      .board-empty { color: var(--dim); }
      .report-h { font-size: 10.5px; letter-spacing: 0.2em; color: var(--dim); margin-bottom: 6px; }
      #result { justify-content: flex-start; padding-top: 40px; }
      .result-title { font-size: 26px; letter-spacing: 0.16em; }
      .result-title.good { color: var(--accent); }
      .result-title.bad { color: var(--bad); }
      .result-sub { color: var(--dim); font-size: 12.5px; }
      .run-note { font-size: 12px; color: var(--dim); min-height: 18px; }
      .run-note.good { color: var(--accent); }
      .report-block { width: min(560px, 92vw); padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); text-align: left; }
      .report-block ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--dim); }
      .word-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .mini-tile { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 8px; background: #1a222b; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
      .mini-tile i { font-style: normal; font-size: 10px; color: var(--dim); }
      .mini-tile.hit { background: #26330f; color: var(--accent); }
      #boot { font-size: 13px; color: var(--dim); }

      /* Multiplayer-specific */
      .lobby { width: min(560px, 92vw); padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); text-align: left; }
      .lobby h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: 0.1em; color: var(--accent); }
      .lobby-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #1a222b; align-items: center; }
      .lobby-row:first-child { border-top: 0; }
      .lobby-seat { width: 28px; color: var(--dim); font-family: monospace; }
      .lobby-name { flex: 1; }
      .lobby-status { font-size: 12px; color: var(--accent); }
      .lobby-code { font-family: monospace; font-size: 14px; letter-spacing: 0.2em; color: var(--ink); background: #1a222c; padding: 8px 12px; border-radius: 8px; margin: 12px 0; text-align: center; }
      .lobby-waiting { color: var(--dim); font-size: 13px; text-align: center; margin-top: 8px; }

      @media (max-width: 640px) {
        .brand { font-size: 26px; }
        .scores .score b { font-size: 24px; }
        .round { min-width: 120px; }
        .buttons button, button.ghost { padding: 8px 13px; font-size: 12.5px; }
        .wall { display: none; }
      }
    </style>
    <script type="module" crossorigin src="/src/multiplayer/entry.ts"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div id="stage"></div>

    <section id="match" class="overlay hidden">
      <header class="hud">
        <div class="kicker">PICK ME</div>
        <div class="hp-row">
          <div class="hp you">
            <span>YOU</span>
            <div class="bar"><i id="hp-you"></i></div>
          </div>
          <div class="round">
            <div id="round-label">ROUND 1</div>
            <div id="owner-label" class="you">TIES GO TO HOST</div>
          </div>
          <div class="hp them">
            <span id="them-name">OPPONENT</span>
            <div class="bar"><i id="hp-them"></i></div>
          </div>
        </div>
        <div class="clock"><i id="timer-fill"></i></div>
        <div class="scores">
          <div class="score" id="score-you"><b id="your-score"></b><span>YOU</span></div>
          <div class="score" id="score-them"><b id="their-score"></b><span>THEM</span></div>
        </div>
        <div id="verdict" class="verdict"></div>
      </header>

      <footer class="controls">
        <div id="readout" class="readout"></div>
        <div id="next-row" class="hidden">
          <button class="primary" id="btn-next">Next round</button>
        </div>
        <div class="buttons">
          <button id="btn-shuffle">Shuffle</button>
          <button id="btn-clear">Clear</button>
          <button id="btn-pass">Pass</button>
          <button class="primary" id="btn-play">Play</button>
        </div>
        <div id="wall" class="wall"></div>
      </footer>
    </section>

    <div id="blank-picker" class="hidden"></div>

    <section id="result" class="screen hidden"></section>

    <section id="title" class="screen hidden">
      <div class="brand">PICK ME</div>
      <p class="tag">Multiplayer: up to 4 players, same letters, short clock.</p>
      <div class="player-card" id="player-card" hidden>
        <img id="player-face" alt="" />
        <div class="who">
          <div class="nm" id="player-name"></div>
          <div class="ac" id="player-account"></div>
        </div>
        <button class="ghost" id="player-sign-in">Sign in</button>
      </div>
      <div class="lobby" id="lobby" hidden>
        <h3>LOBBY</h3>
        <div class="lobby-code" id="lobby-code">—</div>
        <div id="lobby-seats"></div>
        <p class="lobby-waiting" id="lobby-waiting">Waiting for players…</p>
      </div>
      <button class="primary big" id="btn-create">Create Game</button>
      <button class="ghost" id="btn-join">Join by Code</button>
      <div class="dict" id="dict-note"></div>
    </section>

    <section id="boot" class="screen">
      <p id="boot-msg">Loading the word list…</p>
    </section>

  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"ab9964ef827743a68df2a1ccb5883c7e","r":1,"spa":2}' crossorigin="anonymous"></script>

</html>
